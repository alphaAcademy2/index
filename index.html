<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prayer Monitor · HIMAYATHUL ISLAM MADRASA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Noto+Sans+Malayalam:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;font-family:'Inter','Noto Sans Malayalam',-apple-system,BlinkMacSystemFont,sans-serif;background:radial-gradient(circle at 10% 20%,#f0f6ff 0%,#e6edf8 100%);color:#172033;display:flex;align-items:flex-start;justify-content:center;padding:1rem;line-height:1.5;-webkit-font-smoothing:antialiased}
    .app{width:100%;max-width:520px;margin:0 auto;padding:1.5rem 0}
    .card{background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:2.2rem;padding:2rem 1.8rem;box-shadow:0 25px 50px -12px rgba(20,35,60,.25),0 0 0 1px rgba(255,255,255,.7) inset,0 0 0 1px rgba(255,255,255,.9) inset;border:1px solid rgba(255,255,255,.8);animation:cardFade .6s cubic-bezier(.16,1,.3,1)}
    @keyframes cardFade{0%{opacity:0;transform:translateY(16px) scale(.98)}100%{opacity:1;transform:translateY(0) scale(1)}}
    .brand{text-align:center;font-weight:800;font-size:1.35rem;letter-spacing:-.01em;color:#0b1b33;display:flex;align-items:center;justify-content:center;gap:.5rem;flex-wrap:wrap}
    .brand i{color:#1677ff;font-size:1.4rem}
    .subtitle{text-align:center;color:#697386;font-size:.85rem;margin:.4rem 0 1.8rem;display:flex;align-items:center;justify-content:center;gap:.5rem;font-weight:500;letter-spacing:.02em}
    .subtitle i{color:#94a3b8;font-size:.75rem}
    .student{background:linear-gradient(145deg,#f5f9ff,#eef4fc);border-radius:1.4rem;padding:1.2rem 1.4rem;margin-bottom:1.6rem;border:1px solid rgba(255,255,255,.9);box-shadow:0 4px 12px rgba(0,0,0,.02),0 0 0 1px rgba(22,119,255,.08)}
    .student-row{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.5rem 0;border-bottom:1px solid rgba(148,163,184,.15)}
    .student-row:last-child{border-bottom:none;padding-bottom:0}
    .student-row:first-child{padding-top:0}
    .label{color:#5e6b7e;font-size:.8rem;font-weight:500;text-transform:uppercase;letter-spacing:.03em;display:flex;align-items:center;gap:.4rem}
    .label i{color:#94a3b8;font-size:.75rem;width:1rem}
    .value{font-weight:700;text-align:right;color:#0f1a2e;font-size:.95rem}
    .cycle-wrapper{display:flex;justify-content:center}
    .cycle{text-align:center;font-size:.85rem;font-weight:700;margin:1.2rem 0;padding:.7rem 1.2rem;background:linear-gradient(135deg,#eef6ff,#fff);border-radius:100px;display:inline-block;border:1px solid #d9e6ff;color:#1e4e8c;box-shadow:0 2px 8px rgba(22,119,255,.06);letter-spacing:.02em}
    .cycle i{margin-right:.5rem;color:#1677ff;font-size:.85rem}
    #prayers{margin-top:.5rem}
    .prayer{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 1.2rem;border:1px solid #e5e9f0;border-radius:1.2rem;margin-bottom:.8rem;background:#fff;transition:all .2s ease;box-shadow:0 2px 6px rgba(0,0,0,.01)}
    .prayer:hover{border-color:#cbd9ec;box-shadow:0 4px 12px rgba(22,119,255,.06);transform:translateY(-1px)}
    .prayer.locked{background:linear-gradient(145deg,#f2faf5,#eaf7ef);border-color:#bfe3c8}
    .prayer-info{flex:1}
    .prayer-name{font-size:1.05rem;font-weight:700;color:#0b1b33;display:flex;align-items:center;gap:.5rem}
    .prayer-name i{color:#1677ff;font-size:.9rem;width:1.2rem}
    .prayer.locked .prayer-name i{color:#16834b}
    .prayer-date{font-size:.7rem;color:#7a8494;margin-top:.25rem;display:flex;align-items:center;gap:.4rem;font-weight:500}
    .prayer-date i{font-size:.65rem;color:#a0aec0}
    input[type=checkbox]{width:1.6rem;height:1.6rem;accent-color:#16834b;cursor:pointer;border-radius:.4rem;flex-shrink:0;transition:all .15s ease}
    input[type=checkbox]:disabled{opacity:.8;cursor:not-allowed}
    input[type=checkbox]:not(:disabled):hover{transform:scale(1.05)}
    button{width:100%;border:0;border-radius:1.2rem;padding:1rem;margin-top:1rem;background:linear-gradient(145deg,#1677ff,#0b5ed7);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;transition:all .25s ease;box-shadow:0 8px 20px -6px rgba(22,119,255,.4);display:flex;align-items:center;justify-content:center;gap:.6rem;letter-spacing:.01em;font-family:'Inter','Noto Sans Malayalam',sans-serif}
    button i{font-size:1rem}
    button:hover:not(:disabled){background:linear-gradient(145deg,#0b5ed7,#0a4fb5);transform:translateY(-2px);box-shadow:0 12px 24px -8px rgba(22,119,255,.5)}
    button:active:not(:disabled){transform:translateY(0);box-shadow:0 4px 12px -4px rgba(22,119,255,.4)}
    button:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:0 4px 12px -4px rgba(22,119,255,.2)}
    .status{text-align:center;margin-top:1rem;min-height:1.8rem;font-size:.85rem;font-weight:500;display:flex;align-items:center;justify-content:center;gap:.4rem;padding:.4rem .8rem;border-radius:2rem;transition:all .3s ease}
    .status.error{color:#b91c1c;background:#fef2f2;border:1px solid #fecaca}
    .status.success{color:#166534;background:#f0fdf4;border:1px solid #bbf7d0}
    .loading{text-align:center;padding:3rem 1rem;color:#697386;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:1rem;font-size:.95rem}
    .loading i{font-size:2.2rem;color:#1677ff;animation:spin 1.4s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .error{color:#b91c1c;background:#fef2f2;padding:.8rem 1.2rem;border-radius:1rem;border:1px solid #fecaca;font-weight:500;display:inline-flex;align-items:center;gap:.5rem;font-size:.9rem}
    .error i{color:#dc2626}
    @media(max-width:480px){.card{padding:1.5rem 1.2rem;border-radius:1.8rem}.brand{font-size:1.15rem}.prayer{padding:.9rem 1rem}.prayer-name{font-size:.95rem}.value{font-size:.85rem}}
    @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.loading i{animation:none}}
  </style>
</head>
<body>

<div class="app">
  <div class="card">
    <div class="brand">
      <i class="fas fa-mosque"></i>
      HIMAYATHUL ISLAM MADRASA
    </div>
    <div class="subtitle">
      <i class="fas fa-location-dot"></i>
      NADUVATHUR · Prayer Monitor
      <i class="fas fa-circle" style="font-size:.25rem"></i>
    </div>

    <div id="loading" class="loading">
      <i class="fas fa-spinner"></i>
      ലോഡ് ചെയ്യുന്നു...
    </div>

    <div id="content" style="display:none">
      <div class="student">
        <div class="student-row">
          <span class="label"><i class="fas fa-user"></i> പേര്</span>
          <span class="value" id="studentName"></span>
        </div>
        <div class="student-row">
          <span class="label"><i class="fas fa-id-card"></i> Entrance No</span>
          <span class="value" id="studentId"></span>
        </div>
        <div class="student-row">
          <span class="label"><i class="fas fa-graduation-cap"></i> Class</span>
          <span class="value" id="studentClass"></span>
        </div>
      </div>

      <div class="cycle-wrapper">
        <div class="cycle" id="cycle"></div>
      </div>

      <div id="prayers"></div>

      <button id="submitBtn" onclick="submitPrayers()">
        <i class="fas fa-check-circle"></i> Submit
      </button>

      <div id="status" class="status"></div>
    </div>
  </div>
</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbxqrPbBbo_MuLlOIfjBuzr95WqqBM3QMV8AYuI0JmPZwhX5ahOH5l9QyzXYae2alKDh/exec';
  const studentId = new URLSearchParams(location.search).get('id') || '';
  const prayerKeys = ['Dhuhr', 'Asr', 'Maghrib', 'Isha', 'Fajr'];
  let currentRecord = { Dhuhr: false, Asr: false, Maghrib: false, Isha: false, Fajr: false };
  let isSubmitting = false; // prevent double submit

  function api(action, data = {}) {
    return new Promise((resolve, reject) => {
      const callback = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
      const params = new URLSearchParams({ action, callback, ...data });
      const script = document.createElement('script');
      const timer = setTimeout(() => { cleanup(); reject(new Error('API timeout')); }, 20000);

      function cleanup() {
        clearTimeout(timer);
        script.remove();
        delete window[callback];
      }

      window[callback] = r => { cleanup(); resolve(r); };
      script.onerror = () => { cleanup(); reject(new Error('API connection failed')); };
      script.src = API_URL + '?' + params.toString();
      document.body.appendChild(script);
    });
  }

  // ✅ Reset button to normal state
  function resetButton() {
    const btn = document.getElementById('submitBtn');
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-check-circle"></i> Submit';
    isSubmitting = false;
  }

  async function load() {
    if (!studentId) {
      showError('Student ID ലഭ്യമല്ല.');
      return;
    }
    try {
      const result = await api('getPrayerRecord', { studentId });
      if (!result || !result.ok) {
        showError(result?.message || 'Student വിവരങ്ങൾ ലഭ്യമല്ല.');
        return;
      }
      render(result);
    } catch (e) {
      showError('Connection error. വീണ്ടും ശ്രമിക്കുക.');
    }
  }

  function render(result) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    document.getElementById('studentName').textContent = result.student.name;
    document.getElementById('studentId').textContent = result.student.id;
    document.getElementById('studentClass').textContent = result.student.className;

    const cycleEl = document.getElementById('cycle');
    cycleEl.innerHTML = '<i class="fas fa-calendar-check"></i> Cycle: ' + escapeHtml(result.cycle.cycleDateLabel);

    currentRecord = {
      Dhuhr: !!result.record.Dhuhr,
      Asr: !!result.record.Asr,
      Maghrib: !!result.record.Maghrib,
      Isha: !!result.record.Isha,
      Fajr: !!result.record.Fajr
    };

    const container = document.getElementById('prayers');
    container.innerHTML = '';

    result.cycle.prayers.forEach(p => {
      const locked = currentRecord[p.key] === true;
      const div = document.createElement('div');
      div.className = 'prayer' + (locked ? ' locked' : '');
      const iconClass = locked ? 'fa-check-circle' : 'fa-circle';
      div.innerHTML = `
        <div class="prayer-info">
          <div class="prayer-name">
            <i class="fas ${iconClass}"></i>
            ${escapeHtml(p.label)}
          </div>
          <div class="prayer-date">
            <i class="fas fa-calendar-alt"></i>
            ${escapeHtml(p.dateLabel)}
          </div>
        </div>
        <input type="checkbox" id="${p.key}" ${locked ? 'checked disabled' : ''}>
      `;
      container.appendChild(div);
    });

    document.getElementById('status').textContent = '';
    document.getElementById('status').className = 'status';

    // ✅ Always reset button after render
    resetButton();
  }

  async function submitPrayers() {
    // prevent double submit
    if (isSubmitting) return;

    const btn = document.getElementById('submitBtn');
    const status = document.getElementById('status');
    const payload = { studentId };
    let selectedNew = false;

    prayerKeys.forEach(key => {
      const checkbox = document.getElementById(key);
      const newlySelected = checkbox && !checkbox.disabled && checkbox.checked && !currentRecord[key];
      payload[key] = newlySelected;
      if (newlySelected) selectedNew = true;
    });

    if (!selectedNew) {
      status.className = 'status error';
      status.innerHTML = '<i class="fas fa-exclamation-circle"></i> പുതിയ നിസ്കാരം തിരഞ്ഞെടുക്കപ്പെട്ടിട്ടില്ല.';
      return;
    }

    isSubmitting = true;
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
    status.className = 'status';
    status.textContent = '';

    try {
      const result = await api('submitPrayers', payload);
      if (!result || !result.ok) {
        status.className = 'status error';
        status.innerHTML = '<i class="fas fa-exclamation-circle"></i> ' + escapeHtml(result?.message || 'Save failed.');
        resetButton(); // ✅ reset on failure
        return;
      }

      // ✅ Success: show message and reset button IMMEDIATELY
      status.className = 'status success';
      status.innerHTML = '<i class="fas fa-check-circle"></i> ' + escapeHtml(result.message || 'Saved.');
      resetButton();

      // ✅ Reload data silently (without showing spinner)
      setTimeout(() => {
        load().catch(() => {}); // silent reload
      }, 800);

    } catch (e) {
      status.className = 'status error';
      status.innerHTML = '<i class="fas fa-exclamation-circle"></i> Connection error. വീണ്ടും ശ്രമിക്കുക.';
      resetButton(); // ✅ reset on error
    }
  }

  function showError(message) {
    document.getElementById('loading').innerHTML = `
      <div class="error">
        <i class="fas fa-exclamation-triangle"></i>
        ${escapeHtml(message)}
      </div>
    `;
  }

  function escapeHtml(v) {
    return String(v ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  load();
</script>
</body>
</html>
