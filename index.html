<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Prayer Monitor</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f4f7fb;color:#18212f;font-family:Arial,"Noto Sans Malayalam",sans-serif}
body{padding:16px}
.loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f4f7fb;z-index:10}
.loader-box{text-align:center}
.loader-icon{font-size:50px;animation:pulse 1.2s infinite}
.loader-text{margin-top:10px;color:#475569;font-weight:700}
@keyframes pulse{0%,100%{transform:scale(.95);opacity:.7}50%{transform:scale(1.08);opacity:1}}
.wrap{width:100%;max-width:520px;margin:auto;padding:2px}
.card{background:#fff;border-radius:22px;padding:20px;box-shadow:0 10px 35px #00000012}
h1{font-size:23px;margin:0 0 7px}.sub{color:#64748b;margin-bottom:18px;font-size:14px}
.student{background:#eef6ff;border-radius:16px;padding:14px;margin:14px 0}
.row{display:flex;justify-content:space-between;padding:6px 0;gap:14px}
.label{color:#64748b}.value{font-weight:700;text-align:right}
.prayer{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid #e5e7eb;border-radius:14px;margin:9px 0;background:#fff}
.prayer input{width:22px;height:22px;accent-color:#166534;flex:none}
.prayer label{flex:1;font-size:17px}
.prayer-date{display:block;font-size:12px;color:#64748b;margin-top:3px}
.btn{width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:700;background:#166534;color:white;margin-top:15px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{padding:12px;border-radius:12px;margin:12px 0;display:none;line-height:1.5}
.error{background:#fee2e2;color:#991b1b}.success{background:#dcfce7;color:#166534}
.closed{background:#fff7ed;color:#9a3412;padding:13px;border-radius:12px;margin-top:12px}
.cycle{font-weight:800;font-size:18px;margin:8px 0 12px}
@media(max-width:380px){body{padding:10px}.card{padding:16px;border-radius:18px}h1{font-size:21px}.prayer{padding:12px}.prayer label{font-size:16px}}
</style>
</head>
<body>

<div id="loading" class="loading">
  <div class="loader-box">
    <div class="loader-icon">🕌</div>
    <div class="loader-text">നിസ്കാരം മോണിറ്ററിംഗ്</div>
  </div>
</div>

<div class="wrap">
  <div class="card">
    <h1>🕌 നിസ്കാരം മോണിറ്ററിംഗ്</h1>
    <div class="sub">വിദ്യാർത്ഥിയുടെ നിസ്കാരം രേഖപ്പെടുത്തുക</div>
    <div id="message" class="msg"></div>
    <div id="app"></div>
  </div>
</div>

<script>
/*
  IMPORTANT:
  Deploy Code.gs as a Google Apps Script Web App and paste its /exec URL here.
*/
const API_URL = 'PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE';

const params = new URLSearchParams(window.location.search);
const studentId = (params.get('id') || '').trim();

function hideLoading(){
  const el = document.getElementById('loading');
  if(el) el.style.display='none';
}

function showMsg(text,type){
  const el=document.getElementById('message');
  el.textContent=text;
  el.className='msg '+type;
  el.style.display='block';
}

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g,m=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[m]));
}

function api(action, data={}, timeoutMs=15000){
  return new Promise((resolve,reject)=>{
    const callbackName = '__namazApi_' + Date.now() + '_' + Math.floor(Math.random()*100000);
    const query = new URLSearchParams();
    query.set('action', action);
    query.set('callback', callbackName);

    Object.keys(data).forEach(key=>{
      const value=data[key];
      if(value !== undefined && value !== null) query.set(key,String(value));
    });

    const script=document.createElement('script');
    const timer=setTimeout(()=>{
      cleanup();
      reject(new Error('API request timed out.'));
    },timeoutMs);

    function cleanup(){
      clearTimeout(timer);
      delete window[callbackName];
      if(script.parentNode) script.parentNode.removeChild(script);
    }

    window[callbackName]=(result)=>{
      cleanup();
      resolve(result);
    };

    script.onerror=()=>{
      cleanup();
      reject(new Error('API connection failed.'));
    };

    script.src=API_URL+(API_URL.includes('?')?'&':'?')+query.toString();
    document.body.appendChild(script);
  });
}

function render(data){
  hideLoading();

  if(!data || !data.ok){
    showMsg(data && data.message ? data.message : 'Student information ലഭ്യമല്ല.','error');
    return;
  }

  const s=data.student;
  const r=data.record || {};
  const c=data.cycle;
  const disabled=Boolean(r.submitted);

  let html=`
    <div class="student">
      <div class="row"><span class="label">പേര്</span><span class="value">${esc(s.name)}</span></div>
      <div class="row"><span class="label">ID</span><span class="value">${esc(s.id)}</span></div>
      <div class="row"><span class="label">ക്ലാസ്</span><span class="value">${esc(s.className)}</span></div>
    </div>
    <div class="cycle">📅 ${esc(c.cycleDateLabel)}</div>
  `;

  c.prayers.forEach(p=>{
    html += `
      <div class="prayer">
        <input id="${p.key}" type="checkbox" ${r[p.key]?'checked':''} ${disabled?'disabled':''}>
        <label for="${p.key}">
          ${esc(p.label)}
          <span class="prayer-date">${esc(p.dateLabel)}</span>
        </label>
      </div>`;
  });

  if(r.submitted){
    html += `<div class="closed">✅ ഈ ദിവസത്തെ എൻട്രി ഇതിനകം Submit ചെയ്തിട്ടുണ്ട്.</div>`;
  }

  html += `<button id="submit" class="btn" ${disabled?'disabled':''}>SUBMIT</button>`;
  document.getElementById('app').innerHTML=html;

  if(!disabled) document.getElementById('submit').onclick=submit;
}

async function submit(){
  const btn=document.getElementById('submit');
  btn.disabled=true;
  btn.textContent='SUBMITTING...';

  const payload={
    studentId:studentId,
    Dhuhr:document.getElementById('Dhuhr').checked,
    Asr:document.getElementById('Asr').checked,
    Maghrib:document.getElementById('Maghrib').checked,
    Isha:document.getElementById('Isha').checked,
    Fajr:document.getElementById('Fajr').checked
  };

  try{
    const res = await api('submitPrayers', {
      studentId: payload.studentId,
      Dhuhr: payload.Dhuhr,
      Asr: payload.Asr,
      Maghrib: payload.Maghrib,
      Isha: payload.Isha,
      Fajr: payload.Fajr
    });

    if(res && res.ok){
      showMsg(res.message,'success');
      await load();
    }else{
      showMsg(res && res.message ? res.message : 'Submit ചെയ്യാൻ കഴിഞ്ഞില്ല.','error');
      btn.disabled=false;
      btn.textContent='SUBMIT';
    }
  }catch(e){
    showMsg('Server Error: '+(e && e.message ? e.message : e),'error');
    btn.disabled=false;
    btn.textContent='SUBMIT';
  }
}

async function load(){
  if(!studentId){
    hideLoading();
    showMsg('Student ID ലഭ്യമല്ല.','error');
    return;
  }

  if(!API_URL || API_URL.includes('PASTE_YOUR_')){
    hideLoading();
    showMsg('Google Apps Script API URL index.html-ൽ ചേർത്തിട്ടില്ല.','error');
    return;
  }

  try{
    const data = await api('getPrayerRecord', {studentId:studentId});
    render(data);
  }catch(e){
    hideLoading();
    showMsg('Server Error: '+(e && e.message ? e.message : e),'error');
  }
}

window.addEventListener('load',load);
</script>
</body>
</html>
