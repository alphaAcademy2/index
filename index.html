<!doctype html>
<html lang="ml"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b50"><title>HIMAYATHUL ISLAM MADRASA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Malayalam:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f6fc;color:#17243a;font-family:Inter,'Noto Sans Malayalam',sans-serif}.wrap{max-width:620px;margin:auto;padding:20px 15px 45px}.hero{background:linear-gradient(135deg,#102b50,#1766a5);color:white;border-radius:26px;padding:26px 22px;box-shadow:0 15px 35px #153b6330}.brand{font-weight:800;font-size:19px;line-height:1.5}.sub{opacity:.8;font-size:12px;margin-top:4px}.profile{margin-top:20px;background:#ffffff18;border:1px solid #ffffff30;border-radius:17px;padding:14px;display:flex;justify-content:space-between;gap:12px;align-items:center}.profile small{display:block;opacity:.75}.profile b{font-size:16px}.pill{background:#ffffff20;border-radius:30px;padding:7px 10px;font-size:12px;white-space:nowrap}.section{margin:22px 2px 12px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{border:0;text-align:left;background:white;border-radius:20px;padding:18px 15px;min-height:118px;box-shadow:0 5px 18px #1c3b6010;color:#17243a;cursor:pointer}.tile .ico{font-size:25px;display:block;margin-bottom:12px}.tile b{font-size:15px}.tile small{display:block;color:#738096;margin-top:4px}.panel{background:white;border-radius:20px;padding:18px;margin-top:15px;box-shadow:0 5px 18px #1c3b6010}.hidden{display:none}.back{border:0;background:#e7eef8;color:#17436e;padding:10px 14px;border-radius:12px;font-weight:700;margin-bottom:14px}.item{padding:13px 0;border-bottom:1px solid #edf1f6}.item:last-child{border:0}.muted{color:#738096;font-size:13px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.btn{border:0;background:#1766a5;color:white;padding:11px 14px;border-radius:12px;font-weight:700}.field{width:100%;padding:12px;border:1px solid #dce4ee;border-radius:11px;margin:6px 0 12px;font:inherit}.checkrow{display:flex;justify-content:space-between;padding:12px;border:1px solid #e7edf5;border-radius:13px;margin:9px 0}.notice{background:#fff8e8;border:1px solid #f6e4b9;border-radius:14px;padding:13px;margin:10px 0}.status{padding:10px 0;color:#1766a5;font-size:13px}@media(max-width:380px){.grid{gap:8px}.tile{padding:14px}.brand{font-size:16px}}
</style></head><body><main class="wrap">
<div class="hero"><div class="brand">☪ HIMAYATHUL ISLAM MADRASA</div><div class="sub">NADUVATHUR · STUDENT PORTAL</div><div id="profile" class="profile"><div><small>വിദ്യാർത്ഥി</small><b id="studentName">ലോഡ് ചെയ്യുന്നു...</b></div><span class="pill" id="studentMeta">—</span></div></div>
<div id="home"><div class="section">വിദ്യാർത്ഥി സേവനങ്ങൾ</div><div class="grid">
<button class="tile" onclick="openPage('prayer')"><span class="ico">🕌</span><b>നിസ്കാര നിരീക്ഷണം</b><small>ദൈനംദിന നിസ്കാര രേഖ</small></button>
<button class="tile" onclick="openPage('records')"><span class="ico">📚</span><b>പഠന പ്രവർത്തനങ്ങൾ</b><small>അധ്യാപകൻ നൽകിയ ചോദ്യങ്ങൾ</small></button>
<button class="tile" onclick="openPage('results')"><span class="ico">🏅</span><b>പരീക്ഷാ ഫലങ്ങൾ</b><small>മാർക്കും വിലയിരുത്തലും</small></button>
<button class="tile" onclick="openPage('notices')"><span class="ico">📢</span><b>അറിയിപ്പുകൾ</b><small>മദ്റസാ അറിയിപ്പുകൾ</small></button>
</div></div>
<section id="page" class="panel hidden"><button class="back" onclick="goHome()">← തിരികെ</button><div id="pageBody"></div></section>
<div id="status" class="status"></div>
</main><script>
const API_URL='https://script.google.com/macros/s/AKfycbzAHFgJynpZcqmwalkTPfocNu6piglgDmGRlqjfybV0CYaBNMbSN7FLOkmB0yiWR3Fa/exec';
const id=new URLSearchParams(location.search).get('id')||'';
let student=null,teacherToken='',isAdmin=false;
function api(action,data={}){return new Promise((resolve,reject)=>{const cb='cb'+Date.now()+Math.floor(Math.random()*9999),s=document.createElement('script'),t=setTimeout(()=>{clean();reject(Error('API timeout'))},20000);function clean(){clearTimeout(t);s.remove();delete window[cb]}window[cb]=v=>{clean();resolve(v)};s.onerror=()=>{clean();reject(Error('API connection error'))};s.src=API_URL+'?'+new URLSearchParams({action,callback:cb,...data});document.body.appendChild(s)})}
function msg(t){document.getElementById('status').textContent=t}
async function init(){const q=new URLSearchParams(location.search);if(q.get('role')==='teacher'){location.replace('../admin/?role=teacher&token='+encodeURIComponent(q.get('token')||''));return}if(q.get('role')==='admin'){location.replace('../admin/?role=admin&token='+encodeURIComponent(q.get('token')||''));return}if(!id){document.getElementById('studentName').textContent='QR ID ലഭ്യമല്ല';msg('വിദ്യാർത്ഥിയുടെ QR Code വീണ്ടും സ്കാൻ ചെയ്യുക.');return}try{const r=await api('studentHome',{id});if(!r.ok)throw Error(r.message);student=r.student;document.getElementById('studentName').textContent=student.name;document.getElementById('studentMeta').textContent='ക്ലാസ് '+student.className+' · '+student.id}catch(e){msg(e.message)}}
function goHome(){document.getElementById('home').classList.remove('hidden');document.getElementById('page').classList.add('hidden')}
function openPage(p){document.getElementById('home').classList.add('hidden');document.getElementById('page').classList.remove('hidden');const b=document.getElementById('pageBody');b.innerHTML='<p>ലോഡ് ചെയ്യുന്നു...</p>';({prayer:loadPrayer,records:loadRecords,results:loadResults,notices:loadNotices}[p]||(()=>{}))(b)}
async function loadPrayer(b){try{const r=await api('getPrayerRecord',{id});if(!r.ok)throw Error(r.message);b.innerHTML='<h3>🕌 നിസ്കാര നിരീക്ഷണം</h3><p class="muted">സൈക്കിൾ: '+r.cycle.cycleDateLabel+'</p>'+r.cycle.prayers.map(p=>'<label class="checkrow">'+p.label+' <input type="checkbox" id="p_'+p.key+'" '+(r.record[p.key]?'checked disabled':'')+'></label>').join('')+'<button class="btn" onclick="savePrayer()">സമർപ്പിക്കുക</button><div id="substatus" class="status"></div>'}catch(e){b.textContent=e.message}}
async function savePrayer(){const d={id};['Dhuhr','Asr','Maghrib','Isha','Fajr'].forEach(k=>d[k]=!!document.getElementById('p_'+k)?.checked);try{const r=await api('submitPrayers',d);document.getElementById('substatus').textContent=r.message;if(r.ok)loadPrayer(document.getElementById('pageBody'))}catch(e){document.getElementById('substatus').textContent=e.message}}
async function loadRecords(b){try{const r=await api('studentRecords',{id});if(!r.ok)throw Error(r.message);b.innerHTML='<h3>📚 പഠന പ്രവർത്തനങ്ങൾ</h3>'+(!r.records.length?'<p class="muted">ഇപ്പോൾ പ്രവർത്തനങ്ങളൊന്നുമില്ല.</p>':r.records.map(x=>'<div class="item"><b>'+esc(x.Title)+'</b><p>'+esc(x.Description||'')+'</p><small class="muted">അവസാന തീയതി: '+esc(x['Due Date']||'—')+'</small><div id="response_'+x['Record ID']+'">'+responseControl(x)+'</div></div>').join(''))}catch(e){b.textContent=e.message}}
function responseControl(x){const idv=esc(x['Record ID']);if(x.answer)return '<p class="muted">നിങ്ങളുടെ ഉത്തരം: '+esc(x.answer)+'</p>';let type=x['Response Type'];if(type==='yesno')return '<button class="btn" onclick="sendAnswer(\''+idv+'\',\'അതെ\')">അതെ</button> <button class="btn" onclick="sendAnswer(\''+idv+'\',\'ഇല്ല\')">ഇല്ല</button>';if(type==='choice'){return '<select class="field" id="ans_'+idv+'">'+String(x.Options||'').split('|').map(v=>'<option>'+esc(v)+'</option>').join('')+'</select><button class="btn" onclick="sendAnswer(\''+idv+'\',document.getElementById(\'ans_'+idv+'\').value)">സമർപ്പിക്കുക</button>'}return '<textarea class="field" id="ans_'+idv+'" placeholder="നിങ്ങളുടെ ഉത്തരം"></textarea><button class="btn" onclick="sendAnswer(\''+idv+'\',document.getElementById(\'ans_'+idv+'\').value)">സമർപ്പിക്കുക</button>'}
async function sendAnswer(recordId,answer){const r=await api('submitResponse',{id,recordId,answer});msg(r.message);loadRecords(document.getElementById('pageBody'))}
async function loadResults(b){try{const r=await api('studentResults',{id});if(!r.ok)throw Error(r.message);b.innerHTML='<h3>🏅 പരീക്ഷാ ഫലങ്ങൾ</h3>'+(!r.results.length?'<p class="muted">ഫലങ്ങൾ പ്രസിദ്ധീകരിച്ചിട്ടില്ല.</p>':r.results.map(x=>'<div class="item"><b>'+esc(x.Subject||'പരീക്ഷ')+'</b><div class="row"><span>'+esc(x['Student Name'])+'</span><b>'+x.Marks+' / '+x['Max Marks']+'</b></div><small class="muted">'+esc(x.Remarks||'')+'</small></div>').join(''))}catch(e){b.textContent=e.message}}
async function loadNotices(b){try{const r=await api('studentNotices',{id});if(!r.ok)throw Error(r.message);b.innerHTML='<h3>📢 അറിയിപ്പുകൾ</h3>'+(!r.notices.length?'<p class="muted">പുതിയ അറിയിപ്പുകളില്ല.</p>':r.notices.map(x=>'<div class="notice"><b>'+esc(x.Title)+'</b><p>'+esc(x.Message)+'</p><small class="muted">'+esc(x['Created At'])+'</small></div>').join(''))}catch(e){b.textContent=e.message}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
init();
</script></body></html>
