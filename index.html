<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10243d"><title>HIMAYATHUL ISLAM MADRASA | Admin Portal</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Malayalam:wght@400;500;600;700;800&display=swap" rel="stylesheet"><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--navy:#10243d;--blue:#2563eb;--teal:#0f8b83;--ink:#172b45;--muted:#718096;--line:#e7edf4;--bg:#f3f6fb;--white:#fff;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,'Noto Sans Malayalam',sans-serif}.shell{max-width:1240px;margin:auto;padding:22px}.hero{background:linear-gradient(120deg,#0d2038,#174c76 62%,#157c82);color:#fff;border-radius:24px;padding:24px 28px;display:flex;justify-content:space-between;align-items:center;gap:15px;box-shadow:0 16px 36px #10243d20}.brand{font-weight:800;font-size:19px}.sub{color:#c7d8e8;font-size:11px;margin-top:6px;letter-spacing:1.3px}.hero small{color:#d6e6f3}.login{max-width:430px;margin:9vh auto;background:#fff;padding:30px;border-radius:22px;box-shadow:0 18px 50px #173b6318}.login h2{margin:0 0 8px}.muted{color:var(--muted);font-size:12px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #dce4ee;border-radius:10px;font:inherit;background:#fff;margin:6px 0 12px;color:var(--ink)}textarea{min-height:85px}label{font-size:12px;font-weight:700;color:#53647b}button{border:0;background:var(--blue);color:#fff;padding:10px 14px;border-radius:10px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}button:hover{filter:brightness(.96)}button:disabled{opacity:.55;cursor:wait}.ghost{background:#edf3fa;color:#234568}.danger{background:#fff0f0;color:#ad3030}.success{background:#e8f7f2;color:#08785f}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0}.who{font-weight:800}.scope{font-size:12px;color:var(--muted);margin-top:4px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.tile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;text-align:left;min-height:135px;box-shadow:0 7px 22px #10243d08;transition:.18s}.tile:hover{transform:translateY(-2px);box-shadow:0 14px 30px #10243d12}.tile .ico{width:40px;height:40px;border-radius:12px;background:#eaf2ff;display:grid;place-items:center;font-size:20px;margin-bottom:12px}.tile h3{font-size:15px;margin:0 0 6px}.tile p{font-size:11px;color:var(--muted);margin:0;line-height:1.6}.section{background:#fff;border:1px solid var(--line);border-radius:19px;padding:21px;margin-top:15px;box-shadow:0 7px 22px #10243d07}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.sectionhead h2{font-size:18px;margin:0}.back{background:#edf3fa;color:#234568}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin:15px 0}.stat{background:#fff;border:1px solid var(--line);padding:15px;border-radius:15px}.stat b{display:block;font-size:23px}.stat span{font-size:11px;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 13px}.list{border-top:1px solid var(--line)}.entry{padding:13px 2px;border-bottom:1px solid var(--line)}.entry strong{display:block;margin-bottom:4px}.entry small{color:var(--muted)}.pill{display:inline-block;padding:4px 9px;border-radius:30px;background:#eaf4ff;color:#245b91;font-size:10px;font-weight:700}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}td,th{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:middle}th{background:#f7f9fc;color:#53647b;white-space:nowrap}.actions{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.notice{background:#f0f7ff;border-left:4px solid var(--blue);padding:11px;border-radius:9px;font-size:12px;margin:10px 0}.classgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.classbox{padding:14px;border:1px solid var(--line);border-radius:14px;background:#fbfdff}.classbox b{display:block;font-size:17px}.qrgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:11px}.qrCard{border:1px solid var(--line);padding:13px;border-radius:14px;text-align:center}.qrbox{display:flex;justify-content:center;padding:9px}.status{font-size:12px;color:var(--blue);padding:8px 0;min-height:24px}.error{color:var(--red)}.daycard{border:1px solid var(--line);border-radius:13px;padding:13px;margin:10px 0;background:#fbfdff}.daycard h4{margin:0 0 8px}.subjectrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center}.subjectrow input{margin:3px 0}.subjectrow button{padding:8px 10px}.subjline{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #edf1f6;font-size:12px}.subjline:last-child{border:0}.inline{display:flex;gap:9px;align-items:center}.inline>*{flex:1}.section h3{font-size:15px}.footer{text-align:center;color:#9aa7b8;font-size:10px;padding:22px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.classgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.shell{padding:12px}.hero{padding:19px;border-radius:18px}.brand{font-size:16px}.grid{grid-template-columns:1fr 1fr;gap:8px}.tile{padding:13px;min-height:126px}.tile h3{font-size:12px}.tile p{font-size:10px}.formgrid{grid-template-columns:1fr}.section{padding:15px}.classgrid{grid-template-columns:1fr 1fr}.subjectrow{grid-template-columns:1fr 1fr}.subjectrow button{grid-column:1/-1}}
</style></head><body><main class="shell"><header class="hero"><div><div class="brand">☪ HIMAYATHUL ISLAM MADRASA</div><div class="sub">NADUVATHUR · DIGITAL MANAGEMENT PORTAL</div></div><small>ADMINISTRATION</small></header>
<section id="login" class="login"><h2>Admin / Teacher Login</h2><p class="muted">Enter your access token or open your assigned QR link.</p><label>Access Token<input id="tokenInput" autocomplete="off" placeholder="Access token"></label><button onclick="manualLogin()">Sign In</button><div id="loginMsg" class="status"></div></section>
<div id="app" class="hidden"><div class="topbar"><div><div class="who" id="who"></div><div class="scope" id="scope"></div></div><button class="ghost" onclick="logout()">Logout</button></div><div id="home"></div><div id="page" class="hidden"></div><div id="msg" class="status"></div></div><div class="footer">HIMAYATHUL ISLAM MADRASA · NADUVATHUR</div></main>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbzAHFgJynpZcqmwalkTPfocNu6piglgDmGRlqjfybV0CYaBNMbSN7FLOkmB0yiWR3Fa/exec';let token='',role='',teacher=null,data={},currentSchedule='';
const SUBJECTS=['ദീനിയാത്ത്','അഖ്‌ലാഖ്','ഇംലാഅ്','വായന','എഴുത്ത്','തിലാവത്ത് മൂല്യനിർണയം','ഫിഖ്ഹ്','ദുറൂസുൽ ഇഹ്‌സാൻ','അഖീദ','ചരിത്രം','ലിസാനുൽ ഖുർആൻ','തജ്‌വീദ്','തഫ്സീർ','ഖുർആൻ','ഹിഫ്‌ള്','തിലാവത്ത് പരിശീലനം'];
const DAYS=['Saturday','Sunday','Monday','Tuesday','Wednesday','Thursday'];const EXAMS=['പാദവാർഷിക പരീക്ഷ','അർദ്ധവാർഷിക പരീക്ഷ','വാർഷിക പരീക്ഷ'];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function api(action,params={}){return new Promise((resolve,reject)=>{const cb='cb'+Date.now()+Math.floor(Math.random()*99999),s=document.createElement('script'),tm=setTimeout(()=>{clean();reject(Error('Server did not respond.'))},25000);function clean(){clearTimeout(tm);s.remove();try{delete window[cb]}catch(e){}}window[cb]=r=>{clean();resolve(r)};s.onerror=()=>{clean();reject(Error('Could not connect to API.'))};s.src=API_URL+'?'+new URLSearchParams({action,callback:cb,...params});document.body.appendChild(s)})}
async function boot(){const q=new URLSearchParams(location.search);if(q.get('token')){token=q.get('token');role=q.get('role')==='admin'?'admin':'teacher';await auth()}}
function manualLogin(){token=$('tokenInput').value.trim();role='admin';if(token)auth();else $('loginMsg').textContent='Enter access token.'}
async function auth(){try{const r=await api(role==='admin'?'adminLogin':'teacherLogin',{token});if(!r.ok)throw Error(r.message);teacher=r.teacher||null;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=teacher?teacher.name:'Sadr Muallim';$('scope').textContent=teacher?'Class '+teacher.className+' · Teacher Portal':'All Classes · Administration';await refresh();home()}catch(e){$('loginMsg').textContent=e.message}}
function logout(){location.href=location.pathname}async function refresh(){const r=await api(role==='admin'?'adminDashboard':'teacherDashboard',{token});if(!r.ok)throw Error(r.message);data=r}
function home(){$('page').classList.add('hidden');$('home').classList.remove('hidden');if(teacher){$('home').innerHTML=`<div class="notice">Class ${esc(teacher.className)} · Manage your class records and student activities.</div><div class="grid">${tile('🕌','Prayer Report','Daily and monthly prayer records','prayer')}${tile('📚','Learning Activities','Questions, lessons, links and quizzes','learning')}${tile('🏅','Exam Results','Enter subject-wise marks','results')}${tile('📢','Class Notice','Publish and update the class notice','notices')}${tile('🗓️','Timetable','Regular timetable and exam schedules','timetable')}${tile('💬','Teachers’ Comments','Manage student feedback','feedback')}</div>`}else{$('home').innerHTML=`<div class="notice">Sadr Muallim · Central administration for all classes.</div><div class="stats">${stat('Students',(data.students||[]).length)}${stat('Teachers',(data.teachers||[]).length)}${stat('Learning Activities',(data.activities||[]).length)}${stat('Active Notices',(data.notices||[]).filter(n=>n.Status==='Active').length)}</div><div class="classgrid">${Array.from({length:8},(_,i)=>{const c=String(i+1),n=(data.students||[]).filter(s=>String(s.Class)===c).length,t=(data.teachers||[]).find(x=>String(x.Class)===c);return `<div class="classbox"><b>Class ${c}</b><small>${n} students</small><p class="muted">${esc(t?.Name||'Teacher not assigned')}</p><button class="ghost" onclick="openPage('class','${c}')">Open Class →</button></div>`}).join('')}</div><div class="grid" style="margin-top:15px">${tile('👨‍🎓','Students','Student records','students')}${tile('👨‍🏫','Teachers & QR','Teacher details and QR links','teachers')}${tile('📚','Learning Activities','All class activities','learning')}${tile('📝','Exam Results','Exams and subject marks','results')}${tile('📢','Class Notices','One active notice per class','notices')}${tile('🗓️','Timetable','Regular and exam timetables','timetable')}${tile('🕌','Prayer Reports','Daily and monthly reports','prayer')}${tile('💬','Teachers’ Comments','Student feedback','feedback')}</div>`}}
function tile(i,t,d,k){return `<button class="tile" onclick="openPage('${k}')"><div class="ico">${i}</div><h3>${t}</h3><p>${d}</p></button>`}function stat(t,n){return `<div class="stat"><b>${n}</b><span>${t}</span></div>`}function frame(title,body){$('home').classList.add('hidden');$('page').classList.remove('hidden');$('page').innerHTML=`<section class="section"><div class="sectionhead"><h2>${title}</h2><button class="back" onclick="home()">← Dashboard</button></div>${body}</section>`}function clsSelect(id='fclass',selected=''){return `<select id="${id}">${Array.from({length:8},(_,i)=>`<option value="${i+1}" ${String(i+1)===String(selected)?'selected':''}>Class ${i+1}</option>`).join('')}</select>`}function classFilter(c){return teacher?String(teacher.className)===String(c):true}function selectedClass(id='fclass'){return teacher?String(teacher.className):($(id)?.value||'1')}function confirmDelete(message){return window.confirm(message||'Are you sure you want to delete this item?')}
async function openPage(k,arg=''){try{if(k==='class'){frame('Class '+arg,`<div class="grid">${tile('👨‍🎓','Students','Class students','students')}${tile('🕌','Prayer Report','Class prayer report','prayer')}${tile('📚','Learning Activities','Class activities','learning')}${tile('🗓️','Timetable','Class timetable','timetable')}</div>`);return}
if(k==='students'){const arr=(data.students||[]).filter(s=>classFilter(s.Class));frame('Students',`${!teacher?`<label>Class${clsSelect('sclass')}</label>`:''}<div class="formgrid"><label>Admission ID<input id="sid"></label><label>Student Name<input id="sname"></label>${!teacher?`<label>Class${clsSelect('snewclass')}</label>`:''}<label>Parent Name<input id="parent"></label><label>Phone<input id="phone"></label><label>Gender<input id="gender"></label></div><button onclick="saveStudent()">Save Student</button><div class="list" style="margin-top:15px">${arr.map(s=>entry(`${s.Name} · ${s.ID}`,`Class ${s.Class} · ${s.Phone||''}`)).join('')}</div>`)}
else if(k==='teachers'){if(teacher)throw Error('Admin access only.');frame('Teachers & QR Codes',`<div class="actions"><button onclick="window.print()">Print QR Codes</button><button class="ghost" onclick="loadQR()">Refresh QR Codes</button></div><div id="qrgrid" class="qrgrid"></div><div class="list">${(data.teachers||[]).map(t=>entry('Class '+t.Class+' · '+t.Name,t.Status||'Active')).join('')}</div>`);await loadQR()}
else if(k==='notices'){const cls=selectedClass('nclass');const n=(data.notices||[]).find(x=>String(x['Target Class'])===cls&&String(x.Status||'Active')==='Active');frame('Class Notice',`${!teacher?`<label>Class${clsSelect('nclass',cls)}</label>`:''}<div id="noticeEditor">${n?`<div class="notice"><b>Current Notice</b><h3>${esc(n.Title)}</h3><p>${esc(n.Message)}</p><div class="actions"><button class="ghost" onclick="editNotice('${esc(n['Notice ID'])}')">Edit Notice</button><button class="danger" onclick="removeNotice('${esc(n['Notice ID'])}')">Delete Notice</button></div></div>`:`<div class="empty">No active notice for this class.</div>`}<h3>${n?'Update Notice':'Create Notice'}</h3><label>Notice Title<input id="ntitle" value="${esc(n?.Title||'')}"></label><label>Notice Text<textarea id="nmessage">${esc(n?.Message||'')}</textarea></label><label>Optional Link Title<input id="nlinktitle" placeholder="Open study material"></label><label>Optional Link URL<input id="nlinkurl" placeholder="https://example.com"></label><div class="actions"><button onclick="saveNotice('${esc(n?.['Notice ID']||'')}')">${n?'Update Notice':'Publish Notice'}</button></div><p class="muted">Only one active notice is maintained for each class. Publishing again updates the existing notice.</p></div>`)}
else if(k==='prayer'){const cls=selectedClass('pclass');const month=new Date().toISOString().slice(0,7);frame('Prayer Reports',`${!teacher?`<label>Class${clsSelect('pclass',cls)}</label>`:''}<div class="inline"><label>Report Period<select id="prange" onchange="renderPrayerReport()"><option value="month">Selected Month</option><option value="all">All Records</option></select></label><label>Month<input id="pmonth" type="month" value="${month}" onchange="renderPrayerReport()"></label></div><div id="prayerReport"></div>`);renderPrayerReport()}
else if(k==='timetable'){const cls=selectedClass('ttclass');frame('Timetable Management',`${!teacher?`<label>Class${clsSelect('ttclass',cls)}</label>`:''}<div class="notice">Regular timetable: six days, up to three subjects per day. Empty slots are displayed as Not Set.</div><div class="section"><h3>Regular Timetable</h3><div id="regularEditor"></div></div>${!teacher?`<div class="section"><h3>Exam Timetables</h3><label>Class${clsSelect('examClass',cls)}</label><div class="formgrid"><label>Exam Type<select id="newExamType">${EXAMS.map(x=>`<option>${x}</option>`).join('')}</select></label><label>&nbsp;<button style="margin-top:6px" onclick="createSchedule()">Create Exam Timetable</button></label></div><div id="examScheduleList"></div></div>`:`<div class="section"><h3>Exam Timetables</h3><div id="examScheduleList"></div></div>`}`);renderRegularTimetable();renderExamSchedules()}
else if(k==='results'){const cls=selectedClass('rclass');frame('Exam Results',`${!teacher?`<label>Class${clsSelect('rclass',cls)}</label>`:''}<div class="section"><h3>Add Result</h3><label>Select Exam<select id="examPick" onchange="refreshResultStudents()"></select></label><label>Select Student<select id="resultStudent"></select></label><label>Subject<select id="resultSubject">${SUBJECTS.map(x=>`<option>${x}</option>`).join('')}</select></label><div class="formgrid"><label>Marks<input type="number" id="marks" min="0" step="0.5"></label><label>Maximum Marks<input type="number" id="maxmarks" value="100"></label></div><label>Remarks (Optional)<input id="remarks"></label><button onclick="saveResult()">Save Result</button><div class="muted" id="resultStatus"></div></div><h3>Saved Results</h3><div id="resultList"></div>`);refreshResultStudents();if($('rclass'))$('rclass').onchange=()=>{refreshResultStudents();renderResults()};renderResults()}
else if(k==='feedback'){const arr=(data.feedback||[]).filter(x=>classFilter(x.Class)&&String(x.Status||'Active')==='Active');const st=(data.students||[]).filter(s=>classFilter(s.Class));frame('Teachers’ Comments',`${!teacher?`<label>Class${clsSelect('fbclass')}</label>`:''}<label>Select Student<select id="fbstudent">${st.map(s=>`<option value="${esc(s.ID)}">${esc(s.Name)} · ${esc(s.ID)}</option>`).join('')}</select></label><label>Comment<textarea id="comment" placeholder="Enter student feedback"></textarea></label><button onclick="saveFeedback()">Publish Comment</button><div id="feedbackList" class="list" style="margin-top:15px">${arr.map(f=>feedbackRow(f)).join('')||'<p class="muted">No comments yet.</p>'}</div>`)}
else if(k==='learning'){const acts=(data.activities||[]).filter(a=>classFilter(a.Class));frame('Learning Activities',`${!teacher?`<label>Class${clsSelect('aclass')}</label>`:''}<div class="actions"><button onclick="activityForm()">＋ Create Activity</button></div><div id="activityForm"></div><div class="list">${acts.map(a=>entry(a.Title,`Class ${a.Class} · ${a.Type} · ${(a.responses||[]).length} responses`)).join('')||'<p class="muted">No activities.</p>'}</div>`)}
}catch(e){say(e.message,true)}}
function entry(a,b){return `<div class="entry"><strong>${esc(a)}</strong><small>${esc(b)}</small></div>`}
function renderPrayerReport(){const host=$('prayerReport');if(!host)return;const cls=selectedClass('pclass'),range=$('prange').value,month=$('pmonth').value;let rows=(data.prayers||[]).filter(p=>String(p.Class)===cls);if(range==='month'&&month)rows=rows.filter(p=>dateKey(p['Cycle Date']).startsWith(month));const students=(data.students||[]).filter(s=>String(s.Class)===cls);const keys=['Dhuhr','Asr','Maghrib','Isha','Fajr'];let counts={};students.forEach(s=>{let mine=rows.filter(r=>String(r['Student ID'])===String(s.ID));counts[s.ID]=keys.map(k=>mine.filter(r=>truth(r[k])).length)});host.innerHTML=`<div class="stats">${keys.map((k,i)=>stat(k,students.reduce((n,s)=>n+(counts[s.ID]?.[i]||0),0))).join('')}</div><div class="tablewrap"><table><tr><th>Student</th>${keys.map(k=>`<th>${k}</th>`).join('')}<th>Total</th></tr>${students.map(s=>{const a=counts[s.ID]||[0,0,0,0,0];return `<tr><td>${esc(s.Name)}</td>${a.map(v=>`<td>${v}</td>`).join('')}<td><b>${a.reduce((x,y)=>x+y,0)}</b></td></tr>`}).join('')}</table></div><p class="muted">${rows.length} prayer-record rows included · ${range==='all'?'All available dates':'Month: '+esc(month)}</p>`}
function dateKey(v){if(!v)return '';const d=new Date(v);if(!isNaN(d))return d.toISOString().slice(0,10);return String(v).slice(0,10)}function truth(v){return v===true||String(v).toLowerCase()==='true'||String(v)==='1'}
function renderRegularTimetable(){const cls=selectedClass('ttclass'),arr=(data.timetables||[]).filter(x=>String(x.Class)===cls&&x.Type==='regular'&&String(x.Status||'Active')==='Active');const host=$('regularEditor');if(!host)return;host.innerHTML=DAYS.map(day=>{const items=arr.filter(x=>String(x['Day/Date']).toLowerCase()===day.toLowerCase());return `<div class="daycard"><h4>${day}</h4>${[0,1,2].map(i=>{const x=items[i];return x?`<div class="subjline"><span><b>${esc(x.Subject)}</b> · ${esc(x.Time||'')}</span><span><button class="ghost" onclick="editRegular('${esc(x['Timetable ID'])}')">Edit</button> <button class="danger" onclick="deleteRegular('${esc(x['Timetable ID'])}')">Delete</button></span></div>`:`<div class="subjline"><span>Slot ${i+1}: <b>Not Set</b></span></div>`}).join('')}<div class="subjectrow"><select id="sub_${day}">${SUBJECTS.map(x=>`<option>${x}</option>`).join('')}</select><input id="time_${day}" placeholder="Time e.g. 07:30 - 08:00"><button onclick="addRegular('${day}')">Add Subject</button></div></div>`}).join('')}
async function addRegular(day){const r=await api('saveTimetable',{token,className:selectedClass('ttclass'),type:'regular',dayDate:day,subject:$('sub_'+day).value,time:$('time_'+day).value});say(r.message,!r.ok);if(r.ok){await refresh();renderRegularTimetable()}}
async function editRegular(id){const x=(data.timetables||[]).find(x=>String(x['Timetable ID'])===id);if(!x)return;const subject=prompt('Subject',x.Subject);if(subject===null)return;const time=prompt('Time',x.Time||'');if(time===null)return;const r=await api('updateTimetableItem',{token,itemId:id,subject,time,dayDate:x['Day/Date']});say(r.message,!r.ok);if(r.ok){await refresh();renderRegularTimetable()}}
async function deleteRegular(id){if(!confirmDelete('Delete this timetable entry?'))return;const r=await api('deleteTimetable',{token,itemId:id});say(r.message,!r.ok);if(r.ok){await refresh();renderRegularTimetable()}}
async function createSchedule(){const r=await api('createExamSchedule',{token,className:$('examClass').value,examType:$('newExamType').value});say(r.message,!r.ok);if(r.ok){await refresh();renderExamSchedules()}}
function renderExamSchedules(){const host=$('examScheduleList');if(!host)return;const cls=selectedClass(teacher?'ttclass':'examClass');const schedules=(data.examSchedules||[]).filter(x=>String(x.Class)===cls&&String(x.Status||'Active')==='Active');host.innerHTML=schedules.map(sc=>{const items=(data.examScheduleItems||[]).filter(x=>String(x['Schedule ID'])===String(sc['Schedule ID'])&&String(x.Status||'Active')==='Active');return `<div class="daycard"><div class="sectionhead"><h4>${esc(sc['Exam Type'])}</h4>${!teacher?`<button class="danger" onclick="deleteSchedule('${esc(sc['Schedule ID'])}')">Delete Timetable</button>`:''}</div>${items.map(x=>`<div class="subjline"><span><b>${esc(x.Subject)}</b> · ${esc(x.Date)} · ${esc(x.Time)}</span><span>${teacher?'':`<button class="ghost" onclick="editExamItem('${esc(x['Item ID'])}')">Edit</button> <button class="danger" onclick="deleteExamItem('${esc(x['Item ID'])}')">Delete</button>`}</span></div>`).join('')||'<p class="muted">No subjects added yet.</p>'}<div class="formgrid"><label>Date<input type="date" id="date_${esc(sc['Schedule ID'])}"></label><label>Time<input id="time_${esc(sc['Schedule ID'])}" placeholder="09:00 - 09:45"></label></div><label>Subject<select id="subject_${esc(sc['Schedule ID'])}">${SUBJECTS.map(x=>`<option>${x}</option>`).join('')}</select></label><button onclick="addExamItem('${esc(sc['Schedule ID'])}')">＋ Add Subject</button></div>`}).join('')||'<p class="muted">No exam timetables created for this class.</p>'}
async function addExamItem(id){const r=await api('saveExamScheduleItem',{token,scheduleId:id,date:$('date_'+id).value,time:$('time_'+id).value,subject:$('subject_'+id).value});say(r.message,!r.ok);if(r.ok){await refresh();renderExamSchedules()}}
async function editExamItem(id){const x=(data.examScheduleItems||[]).find(x=>String(x['Item ID'])===id);if(!x)return;const date=prompt('Date (YYYY-MM-DD)',dateKey(x.Date));if(date===null)return;const time=prompt('Time',x.Time);if(time===null)return;const subject=prompt('Subject',x.Subject);if(subject===null)return;const r=await api('updateExamScheduleItem',{token,itemId:id,date,time,subject});say(r.message,!r.ok);if(r.ok){await refresh();renderExamSchedules()}}
async function deleteExamItem(id){if(!confirmDelete('Delete this subject from exam timetable?'))return;const r=await api('deleteExamScheduleItem',{token,itemId:id});say(r.message,!r.ok);if(r.ok){await refresh();renderExamSchedules()}}
async function deleteSchedule(id){if(!confirmDelete('Delete the complete exam timetable?'))return;const r=await api('deleteExamSchedule',{token,scheduleId:id});say(r.message,!r.ok);if(r.ok){await refresh();renderExamSchedules()}}
function refreshResultStudents(){const cls=selectedClass('rclass'),exams=(data.exams||[]).filter(e=>String(e.Class)===cls&&String(e.Status||'Active')==='Active');const pick=$('examPick');if(!pick)return;pick.innerHTML=exams.map(e=>`<option value="${esc(e['Exam ID'])}">${esc(e.Title)}</option>`).join('');const students=(data.students||[]).filter(s=>String(s.Class)===cls&&String(s.Status||'Active')==='Active');$('resultStudent').innerHTML=students.map(s=>`<option value="${esc(s.ID)}">${esc(s.Name)} · ${esc(s.ID)}</option>`).join('')}
function renderResults(){const cls=selectedClass('rclass'),arr=(data.results||[]).filter(x=>String(x.Class)===cls);$('resultList').innerHTML=arr.map(x=>entry(`${x['Student Name']} · ${x.Subject}`,`${x.Marks}/${x['Max Marks']} · ${(data.exams||[]).find(e=>String(e['Exam ID'])===String(x['Exam ID']))?.Title||''}`)).join('')||'<p class="muted">No results saved.</p>'}
async function saveResult(){const r=await api('saveResult',{token,examId:$('examPick').value,studentId:$('resultStudent').value,subject:$('resultSubject').value,marks:$('marks').value,remarks:$('remarks').value});if(!r.ok){say(r.message,true);return}say(r.message);$('marks').value='';$('remarks').value='';await refresh();renderResults();$('resultStatus').textContent='Saved. Select the next subject for the same student or choose another student.'}
async function saveNotice(id){const params={token,title:$('ntitle').value,message:$('nmessage').value};let message=params.message.trim();const url=$('nlinkurl').value.trim(),label=$('nlinktitle').value.trim();if(url){if(!/^https?:\/\//i.test(url)){say('Enter a valid URL starting with http:// or https://.',true);return}message+='\n\n['+(label||'Open Link')+']('+url+')'}params.message=message;if(id)params.noticeId=id;else params.targetClass=selectedClass('nclass');const r=await api(id?'updateNotice':'createNotice',params);say(r.message,!r.ok);if(r.ok){await refresh();openPage('notices')}}
async function removeNotice(id){if(!confirmDelete('Are you sure you want to delete the current class notice?'))return;const r=await api('deleteNotice',{token,noticeId:id});say(r.message,!r.ok);if(r.ok){await refresh();openPage('notices')}}function editNotice(id){$('ntitle').focus()}
function feedbackRow(f){return `<div class="entry"><strong>${esc(f['Student Name'])} · Class ${esc(f.Class)}</strong><p>${esc(f.Comment)}</p><small>${esc(f['Teacher Name']||'Teacher')}</small><div class="actions"><button class="ghost" onclick="editFeedback('${esc(f['Feedback ID'])}')">Edit</button><button class="danger" onclick="removeFeedback('${esc(f['Feedback ID'])}')">Delete</button></div></div>`}
async function saveFeedback(){const r=await api('saveFeedback',{token,studentId:$('fbstudent').value,comment:$('comment').value});say(r.message,!r.ok);if(r.ok){await refresh();openPage('feedback')}}async function editFeedback(id){const x=(data.feedback||[]).find(f=>String(f['Feedback ID'])===id);if(!x)return;const c=prompt('Edit comment',x.Comment);if(c===null)return;const r=await api('updateFeedback',{token,feedbackId:id,comment:c});say(r.message,!r.ok);if(r.ok){await refresh();openPage('feedback')}}async function removeFeedback(id){if(!confirmDelete('Delete this student comment?'))return;const r=await api('deleteFeedback',{token,feedbackId:id});say(r.message,!r.ok);if(r.ok){await refresh();openPage('feedback')}}
async function saveStudent(){const r=await api('saveStudent',{token,id:$('sid').value,name:$('sname').value,className:teacher?.className||$('snewclass').value,gender:$('gender').value,parentName:$('parent').value,phone:$('phone').value});say(r.message,!r.ok);if(r.ok){await refresh();openPage('students')}}
function activityForm(){$('activityForm').innerHTML=`<div class="section"><h3>Create Learning Activity</h3>${!teacher?`<label>Class${clsSelect('aclass')}</label>`:''}<label>Type<select id="atype"><option value="yesno">Yes / No</option><option value="text">Written Answer</option><option value="choice">MCQ / Quiz</option><option value="lesson">Lesson & Meaning</option><option value="link">Learning Link</option><option value="game">Game</option></select></label><label>Title<input id="atitle"></label><label>Content<textarea id="acontent"></textarea></label><label>Options (Use | separator for MCQ)<input id="aoptions" placeholder="A|B|C|D"></label><label>Due Date<input id="adue" type="date"></label><button onclick="saveActivity()">Publish Activity</button></div>`}
async function saveActivity(){const r=await api('saveActivity',{token,className:selectedClass('aclass'),type:$('atype').value,title:$('atitle').value,content:$('acontent').value,options:$('aoptions').value,dueDate:$('adue').value});say(r.message,!r.ok);if(r.ok){await refresh();openPage('learning')}}
async function loadQR(){const r=await api('getQRLinks',{token});if(!r.ok)throw Error(r.message);const host=$('qrgrid');if(!host)return;host.innerHTML='';const list=[{name:'Sadr Muallim',url:r.superAdmin?.url},...(r.teachers||[]).map(x=>({name:'Class '+x.className+' · '+x.name,url:x.url}))];list.forEach(x=>{const d=document.createElement('div');d.className='qrCard';d.innerHTML=`<b>${esc(x.name)}</b><div class="qrbox"></div>`;host.appendChild(d);if(x.url&&window.QRCode)new QRCode(d.querySelector('.qrbox'),{text:x.url,width:120,height:120})})}
function say(t,e=false){$('msg').textContent=t;$('msg').classList.toggle('error',e)}boot();
</script></body></html>
