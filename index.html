<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prayer Monitor</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,"Noto Sans Malayalam",sans-serif;background:#f4f7fb;color:#172033}
.app{width:100%;max-width:520px;margin:auto;min-height:100vh;padding:18px}.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 8px 30px rgba(20,35,60,.1)}
.brand{text-align:center;font-weight:800;font-size:21px}.subtitle{text-align:center;color:#697386;font-size:13px;margin:5px 0 20px}
.student{background:#f1f6ff;border-radius:16px;padding:15px;margin-bottom:18px}.student-row{display:flex;justify-content:space-between;gap:12px;padding:5px 0}
.label{color:#697386;font-size:13px}.value{font-weight:700;text-align:right}.cycle{text-align:center;font-size:14px;font-weight:700;margin:15px 0}
.prayer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px;border:1px solid #e5e9f0;border-radius:15px;margin-bottom:10px;background:#fff}
.prayer.locked{background:#f1f8f3;border-color:#bfe3c8}.prayer-info{flex:1}.prayer-name{font-size:17px;font-weight:800}.prayer-date{font-size:12px;color:#7a8494;margin-top:4px}
input[type=checkbox]{width:25px;height:25px;accent-color:#16834b}button{width:100%;border:0;border-radius:15px;padding:15px;margin-top:10px;background:#1677ff;color:white;font-size:16px;font-weight:800;cursor:pointer}
button:disabled{opacity:.6}.status{text-align:center;margin-top:13px;min-height:20px;font-size:14px}.error{color:#c62828}.success{color:#16834b}.loading{text-align:center;padding:40px 10px;color:#697386}
</style>
</head>
<body>
<div class="app"><div class="card">
<div class="brand">HIMAYATHUL ISLAM MADRASA</div>
<div class="subtitle">NADUVATHUR • Prayer Monitor</div>
<div id="loading" class="loading">ലോഡ് ചെയ്യുന്നു...</div>
<div id="content" style="display:none">
<div class="student">
<div class="student-row"><span class="label">പേര്</span><span class="value" id="studentName"></span></div>
<div class="student-row"><span class="label">Entrance No</span><span class="value" id="studentId"></span></div>
<div class="student-row"><span class="label">Class</span><span class="value" id="studentClass"></span></div>
</div>
<div class="cycle" id="cycle"></div><div id="prayers"></div>
<button id="submitBtn" onclick="submitPrayers()">Submit</button><div id="status" class="status"></div>
</div></div></div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbxqrPbBbo_MuLlOIfjBuzr95WqqBM3QMV8AYuI0JmPZwhX5ahOH5l9QyzXYae2alKDh/exec';
const studentId=new URLSearchParams(location.search).get('id')||'';
const prayerKeys=['Dhuhr','Asr','Maghrib','Isha','Fajr'];
let currentRecord={Dhuhr:false,Asr:false,Maghrib:false,Isha:false,Fajr:false};

function api(action,data={}){
 return new Promise((resolve,reject)=>{
  const callback='cb_'+Date.now()+'_'+Math.floor(Math.random()*100000);
  const params=new URLSearchParams({action,callback,...data});
  const script=document.createElement('script');
  const timer=setTimeout(()=>{cleanup();reject(new Error('API timeout'))},20000);
  function cleanup(){clearTimeout(timer);script.remove();delete window[callback]}
  window[callback]=r=>{cleanup();resolve(r)};
  script.onerror=()=>{cleanup();reject(new Error('API connection failed'))};
  script.src=API_URL+'?'+params.toString();document.body.appendChild(script);
 });
}

async function load(){
 if(!studentId){showError('Student ID ലഭ്യമല്ല.');return}
 try{
  const result=await api('getPrayerRecord',{studentId});
  if(!result||!result.ok){showError(result?.message||'Student വിവരങ്ങൾ ലഭ്യമല്ല.');return}
  render(result);
 }catch(e){showError('Connection error. വീണ്ടും ശ്രമിക്കുക.')}
}

function render(result){
 document.getElementById('loading').style.display='none';
 document.getElementById('content').style.display='block';
 document.getElementById('studentName').textContent=result.student.name;
 document.getElementById('studentId').textContent=result.student.id;
 document.getElementById('studentClass').textContent=result.student.className;
 document.getElementById('cycle').textContent='Cycle: '+result.cycle.cycleDateLabel;

 currentRecord={Dhuhr:!!result.record.Dhuhr,Asr:!!result.record.Asr,Maghrib:!!result.record.Maghrib,Isha:!!result.record.Isha,Fajr:!!result.record.Fajr};
 const container=document.getElementById('prayers');container.innerHTML='';

 result.cycle.prayers.forEach(p=>{
  const locked=currentRecord[p.key]===true;
  const div=document.createElement('div');
  div.className='prayer'+(locked?' locked':'');
  div.innerHTML='<div class="prayer-info"><div class="prayer-name">'+escapeHtml(p.label)+'</div><div class="prayer-date">'+escapeHtml(p.dateLabel)+'</div></div><input type="checkbox" id="'+p.key+'" '+(locked?'checked disabled':'')+'>';
  container.appendChild(div);
 });
 document.getElementById('status').textContent='';
}

async function submitPrayers(){
 const btn=document.getElementById('submitBtn'),status=document.getElementById('status');
 const payload={studentId};let selectedNew=false;

 prayerKeys.forEach(key=>{
  const checkbox=document.getElementById(key);
  const newlySelected=checkbox&&!checkbox.disabled&&checkbox.checked&&!currentRecord[key];
  payload[key]=newlySelected;if(newlySelected)selectedNew=true;
 });

 if(!selectedNew){status.className='status error';status.textContent='പുതിയ നിസ്കാരം തിരഞ്ഞെടുക്കപ്പെട്ടിട്ടില്ല.';return}
 btn.disabled=true;btn.textContent='Saving...';status.className='status';status.textContent='';

 try{
  const result=await api('submitPrayers',payload);
  if(!result||!result.ok){status.className='status error';status.textContent=result?.message||'Save failed.';btn.disabled=false;btn.textContent='Submit';return}
  status.className='status success';status.textContent=result.message||'Saved.';
  setTimeout(load,700);
 }catch(e){
  status.className='status error';status.textContent='Connection error. വീണ്ടും ശ്രമിക്കുക.';
  btn.disabled=false;btn.textContent='Submit';
 }
}

function showError(message){document.getElementById('loading').innerHTML='<div class="error">'+escapeHtml(message)+'</div>'}
function escapeHtml(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
load();
</script>
</body>
</html>
